<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Favicon</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background - Blue gradient (Facebook-ish blue)
        const gradient = ctx.createLinearGradient(0, 0, 512, 512);
        gradient.addColorStop(0, '#2563eb');
        gradient.addColorStop(1, '#1d4ed8');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        
        // Draw play button (triangle)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(180, 140);
        ctx.lineTo(180, 372);
        ctx.lineTo(380, 256);
        ctx.closePath();
        ctx.fill();
        
        // Draw download arrow
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 28;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Arrow shaft
        ctx.beginPath();
        ctx.moveTo(256, 180);
        ctx.lineTo(256, 340);
        ctx.stroke();
        
        // Arrow head
        ctx.beginPath();
        ctx.moveTo(200, 284);
        ctx.lineTo(256, 340);
        ctx.lineTo(312, 284);
        ctx.stroke();
        
        // Arrow base line
        ctx.beginPath();
        ctx.moveTo(200, 380);
        ctx.lineTo(312, 380);
        ctx.stroke();
        
        // Export as PNG
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'favicon-512.png';
            a.click();
        });
    </script>
</body>
</html>
